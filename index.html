<style>
:root{
--bg0:#04060c;--bg1:#070b14;--bg2:#0b1120;--panel:rgba(255,255,255,.035);--panel2:rgba(255,255,255,.05);
--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--glass:rgba(12,17,30,.72);
--txt:#eef2fb;--mut:#93a1bd;--dim:#5f6c86;
--gold:#d9b45a;--gold2:#f4dd94;--blu:#5b8cff;--teal:#37d3c0;--pur:#a488f5;--grn:#3fce78;--amb:#f97316;--red:#f0655f;
--sh:0 18px 50px -12px rgba(0,0,0,.7);--shg:0 0 0 1px var(--line),0 12px 40px -14px rgba(0,0,0,.65);
--rad:16px;--rad2:12px;--sb:248px;
--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;max-width:100vw}
body{background:var(--bg0);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;width:100vw;height:100dvh}
a{color:var(--gold2);text-decoration:none}
h1,h2,h3,h4{line-height:1.2;font-weight:650;letter-spacing:-.01em}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0c1322;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px;color:#bcd0ee}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1c2740;border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#26344f;background-clip:content-box}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}.est{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--amb);border:1px solid rgba(233,178,63,.35);border-radius:5px;padding:0 4px;vertical-align:middle}

/* layered background */
#aurora{position:fixed;inset:-20%;z-index:-2;background:
 radial-gradient(40% 40% at 18% 12%,rgba(91,140,255,.18),transparent 60%),
 radial-gradient(38% 42% at 82% 8%,rgba(217,180,90,.16),transparent 60%),
 radial-gradient(45% 45% at 70% 88%,rgba(55,211,192,.12),transparent 62%),
 radial-gradient(40% 40% at 10% 90%,rgba(164,136,245,.12),transparent 60%);
 filter:blur(30px);animation:drift 26s var(--ease) infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(1.5%,-1.5%,0) scale(1.05)}100%{transform:translate3d(-1.5%,1%,0) scale(1.02)}}
#grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.4;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/></svg>")}
body.reduce #aurora{animation:none}

/* app shell */
#app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:56px 1fr;height:100dvh;width:100vw}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2px;font-size:14.5px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold));box-shadow:0 0 12px rgba(217,180,90,.7)}
.brand b{background:linear-gradient(90deg,#fff,#c8d3ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:9px;letter-spacing:2px;color:var(--gold);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;font-weight:700}
.gsearch{margin-left:8px;flex:1;max-width:440px;position:relative}
.gsearch input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px 8px 32px;font-size:13px;transition:.2s}
.gsearch input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,180,90,.12)}
.gsearch svg{position:absolute;left:10px;top:9px;width:14px;height:14px;color:var(--dim)}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;color:var(--mut);cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--txt);border-color:var(--line2);background:rgba(255,255,255,.06)}
.iconbtn svg{width:16px;height:16px}
.kbd{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#0b1220}

/* sidebar */
#side{grid-row:2/3;background:linear-gradient(180deg,rgba(9,13,22,.6),rgba(6,9,16,.6));backdrop-filter:blur(16px);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;z-index:30}
.navbtn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:var(--mut);cursor:pointer;font-size:13.5px;font-weight:550;border:1px solid transparent;position:relative;transition:.16s var(--ease)}
.navbtn svg{width:17px;height:17px;flex:none;opacity:.85}
.navbtn:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.navbtn.on{background:linear-gradient(90deg,rgba(217,180,90,.14),rgba(217,180,90,.02));color:#fff;border-color:rgba(217,180,90,.28)}
.navbtn.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 10px rgba(217,180,90,.6)}
.navbtn .num{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.side-sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;font-size:10.5px;color:var(--dim);padding:8px 8px 2px;line-height:1.5}

/* main */
#main{grid-row:2/3;position:relative;overflow:hidden;min-width:0}
.mod{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 60px;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .28s var(--ease),transform .28s var(--ease)}
.mod.on{opacity:1;pointer-events:auto;transform:none}
body.reduce .mod{transition:none}
.mhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.mhead h1{font-size:23px}
.mhead .sub{color:var(--mut);font-size:13px}
.mhead .chip{margin-left:auto;font-size:11px;color:var(--gold2);border:1px solid var(--line2);border-radius:20px;padding:3px 10px;background:rgba(217,180,90,.06)}
.lead{color:var(--mut);max-width:920px;margin:8px 0 18px;font-size:13.5px}

/* panels / glass */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px;position:relative;box-shadow:var(--sh);backdrop-filter:blur(8px)}
.panel.hl{background:linear-gradient(180deg,rgba(217,180,90,.06),var(--panel))}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.edge{position:relative;overflow:hidden}
.edge::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 40%,transparent 60%,rgba(217,180,90,.14));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* KPI */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad2);padding:14px 15px;position:relative;overflow:hidden;transition:.2s var(--ease)}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.kpi .kl{font-size:11px;color:var(--mut);letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.kpi .kn{font-size:26px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#fff,#cfd9ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .kc{font-size:11px;margin-top:2px;font-weight:700}
.kc.up{color:var(--grn)}.kc.dn{color:var(--red)}.kc.nu{color:var(--mut)}
.kpi .spark{position:absolute;right:10px;bottom:8px;width:66px;height:26px;opacity:.85}
.kpi.gold{background:linear-gradient(160deg,rgba(217,180,90,.12),var(--panel))}

/* chart card */
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 14px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0}
.chartcard .ch-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chartcard .ch-h .t{font-size:13px;font-weight:650}
.chartcard .ch-h .acts{margin-left:auto;display:flex;gap:4px}
.chartcard .ch-h .acts button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);cursor:pointer;font-size:11px;display:grid;place-items:center;transition:.15s}
.chartcard .ch-h .acts button:hover{color:var(--txt);border-color:var(--line2)}
.chartwrap{position:relative;width:100%;height:230px}
.chartwrap canvas{width:100%;height:100%;display:block;touch-action:none}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11px}
.ch-legend .li{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--mut);user-select:none}
.ch-legend .li.off{opacity:.4;text-decoration:line-through}
.ch-legend .sw{width:9px;height:9px;border-radius:3px}
.ch-tip{position:absolute;pointer-events:none;z-index:5;background:var(--glass);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:11.5px;color:var(--txt);box-shadow:var(--sh);backdrop-filter:blur(10px);opacity:0;transform:translateY(-4px);transition:opacity .12s,transform .12s;white-space:nowrap;max-width:220px}
.ch-tip.on{opacity:1;transform:none}
.ch-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:12px}

/* table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:13px}
.toolbar input.grow{flex:1;min-width:160px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--gold)}
.chkline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:12.5px}
.chkline label{display:inline-flex;align-items:center;gap:5px;color:var(--mut);cursor:pointer}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--txt);border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.16s;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--gold);background:rgba(255,255,255,.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#20180a;border:none;font-weight:700}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.count{color:var(--mut);font-size:12px;margin-left:auto}
.tblshell{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--panel)}
.tblscroll{overflow:auto;max-height:calc(100dvh - 260px)}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:860px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
th{background:rgba(9,13,22,.9);color:var(--mut);font-size:10px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;position:sticky;top:0;z-index:2;backdrop-filter:blur(6px)}
th:hover{color:var(--txt)}th .ar{opacity:.4;font-size:9px}
tbody tr.row{cursor:pointer;transition:background .12s}tbody tr.row:hover{background:rgba(255,255,255,.035)}
td.rk{color:var(--gold);font-weight:800;text-align:center}
td.nm{font-weight:650;white-space:nowrap}
.st{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px}
.st-renamed{background:rgba(233,178,63,.18);color:#f0c86e}.st-deprecated{background:rgba(240,101,95,.2);color:#f39089}.st-unstable{background:rgba(240,101,95,.14);color:#f0a878}.st-gov{background:rgba(63,206,120,.16);color:#7fe3a4}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
.scb{display:inline-block;min-width:34px;text-align:center;font-weight:800;border-radius:7px;padding:3px 7px;font-size:12px}
.s90{background:rgba(63,206,120,.18);color:#72e6a0}.s75{background:rgba(120,200,140,.14);color:#9fe0b4}.s60{background:rgba(233,178,63,.16);color:#f0c86e}.s0{background:rgba(240,101,95,.16);color:#f39089}
.riskL{color:var(--grn)}.riskM{color:var(--amb)}.riskH{color:var(--red)}
.yes{color:var(--grn);font-weight:700}.no{color:var(--dim)}
tr.detail td{background:#080d18;padding:0}
.detin{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 22px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.df .k{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2px}
.df .v{font-size:12.5px}
.detsrc{grid-column:1/-1;border-top:1px dashed var(--line2);padding-top:9px;color:var(--mut);font-size:11px}

/* deep cards */
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad2);margin-bottom:10px;overflow:hidden}
.dcard>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:11px;align-items:center}
.dcard>summary::-webkit-details-marker{display:none}
.dcard>summary:hover{background:rgba(255,255,255,.03)}
.dcard .dn{font-weight:650;font-size:14.5px}.dcard .dc{font-size:11px;color:var(--mut)}
.dcard .dsc{margin-left:auto;font-weight:800;color:var(--gold2);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:12.5px}
.dcard .arr{color:var(--mut);transition:.2s}.dcard[open] .arr{transform:rotate(90deg)}
.dbody{padding:2px 15px 16px;border-top:1px solid var(--line)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 20px;margin-top:10px}
.dfield .k{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2px}
.dfield .v{font-size:12.5px}.dfield.wide{grid-column:1/-1}
.dfield pre{white-space:pre-wrap;background:#0a1020;border:1px solid var(--line2);border-radius:9px;padding:11px;font-size:11.5px;color:#c7d3ea;margin-top:5px;line-height:1.5}

/* combos */
.combo{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px;transition:.2s}
.combo:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.combo h3{font-size:14.5px;margin-bottom:5px}
.combo .apis{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.combo .apis span{font-size:10.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:#cdd9ef}
.combo .arch{font-size:11px;color:var(--mut);margin-top:6px}
.combo .rev{margin-top:9px;font-size:11.5px;color:var(--grn);border-top:1px dashed var(--line2);padding-top:8px}

/* architecture */

<script>
/* ============ CONFIG ============ */
const STRIPE_CONFIG = {
  starterMonthly: "https://buy.stripe.com/3cI7sDcJ65cNejxb0vdQQ2L",
  starterYearly: "https://buy.stripe.com/14A00b9wU8oZ3ET3y3dQQ2M",

};
const APIINTEL_FORM_EP = "https://mdsvcobwuezriexyqqby.supabase.co/functions/v1/apiintel-form";
/* ============ DATA (loaded from trailing scripts) ============ */
let API_DATA=[], DEEP={}, COMBOS=[];
const CATS=[["fin","Finanse i giełda"],["re","Nieruchomości"],["ecom","E-commerce i ceny"],["social","Social media"],["mkt","Reklama i marketing"],["comp","Firmy i lead generation"],["ai","Sztuczna inteligencja"],["pub","Wiadomości i dane publiczne"],["maps","Geolokalizacja i mapy"],["comm","Komunikacja"],["infra","Automatyzacja i infrastruktura"],["alt","Dane alternatywne i niszowe"]];

const PRICE_EUR=[0,25,120,500,1500]; // przybliżony próg wejścia (ESTYMACJA)

/* ============ UTIL ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+" mln":n>=1e3?(Math.round(n/100)/10)+" tys":Math.round(n).toString();
const pln=n=>Math.round(n).toLocaleString("pl-PL")+" zł";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scCls=v=>v>=90?"s90":v>=75?"s75":v>=60?"s60":"s0";
const riskCls=r=>r==="low"?"riskL":r==="med"?"riskM":"riskH";
const riskLbl=r=>r==="low"?"niskie":r==="med"?"średnie":"wysokie";
const riskNum=r=>({low:1,med:2,high:3})[r];
const stLbl={renamed:"renamed",deprecated:"deprecated",unstable:"unstable",gov:"gov/open"};
const REDUCE=()=>document.body.classList.contains("reduce");
function toast(msg,title,type){const t=el("div","toast "+(type||""),(title?`<div class="tt">${title}</div>`:"")+msg);$("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transform="translateX(20px)";setTimeout(()=>t.remove(),300);},3600);}
function modal(html){const m=$("#modal");m.innerHTML=`<button class="iconbtn x" onclick="closeModal()">✕</button>`+html;$("#modalbg").classList.add("on");}
function closeModal(){$("#modalbg").classList.remove("on");}
$("#modalbg").addEventListener("click",e=>{if(e.target.id==="modalbg")closeModal();});
function download(name,txt,type){const b=new Blob([txt],{type});const u=URL.createObjectURL(b);const a=el("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}
function toCSV(rows,cols,head){const esc=v=>{v=(v==null)?"":String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};let c="﻿"+head.join(";")+"\n";rows.forEach(r=>c+=cols.map(k=>esc(typeof k==="function"?k(r):r[k])).join(";")+"\n");return c;}
function animateNum(node,to,suffix,dur){if(REDUCE()){node.textContent=(typeof to==="number"?to.toLocaleString("pl-PL"):to)+(suffix||"");return;}const start=performance.now();const from=0;dur=dur||800;function step(t){const p=clamp((t-start)/dur,0,1);const e=1-Math.pow(1-p,3);const v=from+(to-from)*e;node.textContent=(Math.round(v)).toLocaleString("pl-PL")+(suffix||"");if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}

/* ============ CHART ENGINE (canvas, no deps) ============ */
const _NXA=(getComputedStyle(document.documentElement).getPropertyValue('--acc')||'').trim()||"#5b8cff";
const _NXA2=(getComputedStyle(document.documentElement).getPropertyValue('--acc2')||'').trim()||"#8fb0ff";
const COLORS=[_NXA,_NXA2,"#37d3c0","#a488f5","#3fce78","#6fb0ff","#f0655f","#8fb8ff","#5ee0cf","#a488f5"];
class Chart{
 constructor(container,cfg){
  this.c=container;this.cfg=cfg;this.type=cfg.type;this.data=cfg.data;this.opt=cfg.options||{};
  this.hidden=new Set();this.t=0;this.hot=[];this.sel=null;this.raf=null;
  this.wrap=el("div","chartwrap");this.canvas=el("canvas");this.wrap.appendChild(this.canvas);
  this.tip=el("div","ch-tip");this.wrap.appendChild(this.tip);
  this.empty=el("div","ch-empty hidden","Brak danych");this.wrap.appendChild(this.empty);
  container.appendChild(this.wrap);this.ctx=this.canvas.getContext("2d");
  if(this.opt.legend!==false)this.buildLegend();
  this.bind();this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(this.wrap);
  this.resize();this.animate();
 }
 buildLegend(){
  const s=this.series();if(!s||s.length<2){return;}
  this.legend=el("div","ch-legend");
  s.forEach((se,i)=>{const li=el("div","li");li.innerHTML=`<span class="sw" style="background:${se.color||COLORS[i%COLORS.length]}"></span>${se.name}`;li.onclick=()=>{if(this.hidden.has(i))this.hidden.delete(i);else this.hidden.add(i);li.classList.toggle("off");this.draw(1);};this.legend.appendChild(li);});
  this.c.appendChild(this.legend);
 }
 series(){const d=this.data;if(d.series)return d.series;return null;}
 isEmpty(){const d=this.data;if(d.items)return !d.items.length||d.items.every(i=>!i.value);if(d.stages)return !d.stages.length;if(d.series)return !d.series.length||d.series.every((s,i)=>this.hidden.has(i));return !(d.labels&&d.labels.length);}
 resize(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=this.wrap.clientWidth,h=this.wrap.clientHeight;if(!w||!h)return;this.canvas.width=w*dpr;this.canvas.height=h*dpr;this.ctx.setTransform(dpr,0,0,dpr,0,0);this.W=w;this.H=h;this.draw(this.t>=1?1:this.t);}
 animate(){if(REDUCE()){this.t=1;this.draw(1);return;}const st=performance.now(),dur=650;const step=(now)=>{this.t=clamp((now-st)/dur,0,1);this.draw(1-Math.pow(1-this.t,3));if(this.t<1)this.raf=requestAnimationFrame(step);};this.raf=requestAnimationFrame(step);}
 update(data){this.data=data;this.hidden.clear();if(this.legend){this.legend.remove();this.buildLegend();}this.animate();}
 bind(){
  const move=(ev)=>{const r=this.canvas.getBoundingClientRect();const p=ev.touches?ev.touches[0]:ev;const x=p.clientX-r.left,y=p.clientY-r.top;this.hover(x,y);};
  this.canvas.addEventListener("mousemove",move);
  this.canvas.addEventListener("mouseleave",()=>{this.tip.classList.remove("on");this.sel=null;this.draw(1);});
  this.canvas.addEventListener("touchstart",move,{passive:true});
  this.canvas.addEventListener("touchmove",e=>{move(e);},{passive:true});
  this.canvas.addEventListener("click",(ev)=>{const r=this.canvas.getBoundingClientRect();this.pick(ev.clientX-r.left,ev.clientY-r.top);});
 }
 hover(x,y){let best=null,bd=1e9;this.hot.forEach(h=>{let d;if(h.rect){const r=h.rect;const inside=x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];d=inside?0:Math.hypot(x-(r[0]+r[2]/2),y-(r[1]+r[3]/2));if(!inside&&d>64)d=1e9;}else{d=Math.hypot(x-h.x,y-h.y);if(d>28)d=1e9;}if(d<bd){bd=d;best=h;}});
  if(best&&bd<1e9){this.tip.innerHTML=best.tip;this.tip.classList.add("on");let tx=(best.x!=null?best.x:best.rect[0]+best.rect[2]/2)+12;let ty=(best.y!=null?best.y:best.rect[1])-10;tx=clamp(tx,4,this.W-this.tip.offsetWidth-4);ty=clamp(ty,4,this.H-this.tip.offsetHeight-4);this.tip.style.left=tx+"px";this.tip.style.top=ty+"px";this.selKey=best.key;this.draw(1);}else{this.tip.classList.remove("on");if(this.selKey){this.selKey=null;this.draw(1);}}
 }
 pick(x,y){this.hover(x,y);if(this.opt.onPick&&this.selKey!=null)this.opt.onPick(this.selKey);}
 draw(k){const ctx=this.ctx;if(!this.W)return;ctx.clearRect(0,0,this.W,this.H);this.hot=[];
  if(this.isEmpty()){this.empty.classList.remove("hidden");return;}this.empty.classList.add("hidden");
  const pad={l:44,r:14,t:14,b:this.type==="hbar"?14:26};
  if(this.type==="bar"||this.type==="line")this.drawXY(ctx,pad,k,this.type);
  else if(this.type==="hbar")this.drawHBar(ctx,k);
  else if(this.type==="scatter")this.drawScatter(ctx,pad,k);
  else if(this.type==="donut")this.drawDonut(ctx,k);

/* ============ ECON model ============ */
const DAY_RATE=1200; // zł/dzień wdrożenia (ESTYMACJA)
function funnelCompute(cfg){
 // cfg: traffic, price(zł/mc), convs[](0-1 per stage after first), cac, churn(0-1), margin(0-1), months
 let users=[cfg.traffic];
 for(let i=0;i<cfg.convs.length;i++)users.push(users[users.length-1]*cfg.convs[i]);
 const newPaying=users[users.length-1];
 const months=cfg.months||12;let active=0;const mrrArr=[],revArr=[],custArr=[];
 for(let m=0;m<months;m++){active=active*(1-cfg.churn)+newPaying;const rev=active*cfg.price;mrrArr.push(rev);custArr.push(active);revArr.push(rev);}
 // biggest drop
 let drop={i:0,pct:0};for(let i=1;i<users.length;i++){const d=1-users[i]/(users[i-1]||1);if(d>drop.pct){drop.pct=d;drop.i=i;}}
 const mrr=mrrArr[mrrArr.length-1];const profit=mrr*cfg.margin - newPaying*cfg.cac;
 return {users,newPaying,mrr,arr:mrr*12,mrrArr,custArr,revArr,drop,profit,steadyCust:custArr[custArr.length-1]};
}

function buildRoadmap(opts){
 opts=opts||{};const budget=opts.budget||30000,goal=opts.goal||"B2B SaaS";
 const goalCats={"B2B SaaS":["ai","infra","comp"],"Lead-gen B2B":["comp","mkt","comm"],"Marketplace danych":["pub","comp","alt"],"Konsumencki (B2C)":["fin","social","ecom","maps"]}[goal]||[];
 const maxTier=budget<10000?1:budget<40000?2:budget<100000?3:4;
 const sc=a=>a.sc+a.n8n*2+a.rev/10+(goalCats.includes(a.c)?28:0)+(a.free?6:0);
 let pool=API_DATA.filter(a=>a.risk!=="high"&&a.st!=="deprecated"&&a.prt<=maxTier);
 const picks=pool.sort((a,b)=>sc(b)-sc(a)).slice(0,6);
 const comboScore=c=>c.apis.filter(x=>picks.some(p=>x.includes(p.n.split(" ")[0]))).length + (goalCats.length&&new RegExp(goalCats.join("|"),"i")?0:0);
 const combo=[...COMBOS].sort((a,b)=>comboScore(b)-comboScore(a))[0]||COMBOS[0];
 const p1=["Walidacja problemu na 5–10 klientach","Prototyp na "+(picks[0]?picks[0].n:"kluczowym API"),"Integracje podstawowe: "+picks.slice(0,2).map(a=>a.n).join(", "),"Pierwsza oferta + landing + Stripe Payment Link"];
 const p2=["Automatyzacja w n8n (import→score→alert)","Uruchomienie sprzedaży + outreach","Onboarding pierwszych klientów","Optymalizacja kosztów API/AI (cache, batch)"];
 const p3=["Skalowanie źródeł: "+picks.slice(2,5).map(a=>a.n).join(", "),"Abonament Premium + Enterprise","Raporty i dashboard klienta","Partnerstwa i kolejne rynki (PL→UE)"];
 return {budget,goal,picks,combo,phases:[{t:"0–30 dni",items:p1},{t:"31–60 dni",items:p2},{t:"61–90 dni",items:p3}]};
}

function runAI(){
 const budget=+$("#aiBudget").value,time=+$("#aiTime").value,ind=$("#aiInd").value,tech=+$("#aiTech").value,biz=$("#aiBiz").value,riskTol=$("#aiRisk").value;
 const riskCap={low:1,med:2,high:3}[riskTol];const easeMin=tech===1?7:tech===2?5:1;
 let pool=API_DATA.filter(a=>riskNum(a.risk)<=riskCap&&a.integ>=easeMin&&a.ttdD<=Math.max(time,20)&&a.st!=="deprecated"&&PRICE_EUR[a.prt]*12<=budget*2);
 if(ind)pool=pool.filter(a=>a.c===ind||true); // branża = preferencja, nie twarde
 const score=a=>a.sc*0.4+a.rev*0.3+a.n8n*3+(a.b2b===(biz==="b2b")?8:0)+(a.c===ind?10:0)+(a.free?4:0)-riskNum(a.risk)*3;
 const top=pool.sort((x,y)=>score(y)-score(x)).slice(0,10);
 if(!top.length){$("#aiOut").innerHTML='<div class="panel">Brak API spełniających kryteria — poluzuj budżet/ryzyko.</div>';return;}
 const topNames=new Set(top.slice(0,6).map(a=>a.n));
 const combos=COMBOS.map(c=>({c,hit:c.apis.filter(x=>[...topNames].some(n=>x.includes(n.split(" ")[0]))).length})).sort((a,b)=>b.hit-a.hit).slice(0,5);
 const mvpCost=top.slice(0,3).reduce((s,a)=>s+(a.ttdD<90?a.ttdD:5)*DAY_RATE,0);
 const sub=biz==="b2b"?"199–999 zł/mc":"29–99 zł/mc";
 const model=ind?`Pionowy ${biz.toUpperCase()} na danych „${catName(ind)}” z warstwą AI i alertami n8n`:`${biz.toUpperCase()} SaaS łączący TOP API z warstwą AI/scoring`;
 $("#aiOut").innerHTML=`<div class="panel hl edge"><div class="statline"><div class="s"><div class="n">${pln(mvpCost)}</div><div class="l">koszt MVP ${estMark()}</div></div><div class="s"><div class="n">${time} dni</div><div class="l">czas realizacji</div></div><div class="s"><div class="n">${sub}</div><div class="l">abonament</div></div></div>
  <div style="margin-top:8px"><b>Rekomendowany model:</b> ${model}</div>
  <div style="margin-top:10px"><b class="mut">TOP 10 API:</b><div style="margin-top:5px">${top.map((a,i)=>`<span class="pill" style="margin:2px;display:inline-block">${i+1}. ${a.n} (${a.sc})</span>`).join("")}</div></div>
  <div style="margin-top:10px"><b class="mut">TOP 5 kombinacji:</b><ol style="margin:6px 0 0 18px">${combos.map(x=>`<li style="font-size:12.5px;padding:2px 0">${x.c.t}</li>`).join("")}</ol></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="closeModal();go('road')">Zobacz roadmapę 30/60/90</button><button class="btn" onclick="closeModal();openForm('impl')">Zamów wdrożenie</button></div></div>`;
}

  function ctx(){ try{ if(typeof API_DATA==="undefined"||!API_DATA.length) return ""; return API_DATA.slice().sort(function(a,b){return (b.sc||0)-(a.sc||0);}).slice(0,90).map(function(a){return a.n+" ["+(typeof catName==="function"?catName(a.c):a.c)+" "+(a.sc||"")+"]";}).join("; "); }catch(e){return "";} }
  function toggle(o){open=(o!=null?o:!open);panel.classList.toggle("on",open);if(open){if(!msgs.children.length)add("sys","Cześć! Jestem Copilotem API Intelligence. Zapytaj mnie o dobór API, model abonamentu, koszt MVP albo integracje n8n.");ta.focus();}}

     .then(function(d){ load.remove(); if(d&&d.ok&&d.answer){add("a",d.answer);hist.push({role:"assistant",content:d.answer});} else {add("sys","Nie udało się uzyskać odpowiedzi ("+((d&&d.error)||"błąd")+"). Spróbuj ponownie.");} })
     .catch(function(){ load.remove(); add("sys","Brak połączenia z Copilotem. Spróbuj ponownie."); })
     .finally(function(){ busy=false;send.disabled=false;ta.focus(); if(hist.length>16)hist=hist.slice(-16); });
  }
})();

<script>
/* ===== NEXION experience layer: motywy, parallax, liczniki, mobile tabs ===== */
(function(){
  var THEMES=[
    {v:"arctic",n:"Arctic (jasny)",c:"#2563eb",bg:"#e9edf4"},
    {v:"",n:"Midnight",c:"#8ea2ff",bg:"#05070e"},
    {v:"graphite",n:"Graphite",c:"#c3cbd8",bg:"#0d0e11"},
    {v:"ocean",n:"Ocean",c:"#2fc6e6",bg:"#04111d"},
    {v:"emerald",n:"Emerald",c:"#34d399",bg:"#05130d"}
  ];
  function metaColor(v){var t=THEMES.filter(function(x){return x.v===v;})[0];return t?t.bg:"#05070e";}
  function applyTheme(v){
    if(v)document.documentElement.setAttribute("data-theme",v);else document.documentElement.removeAttribute("data-theme");
    if(v==="arctic"||v==="goldlight")document.documentElement.setAttribute("data-light","1");else document.documentElement.removeAttribute("data-light");
    try{localStorage.setItem("nexion.theme",v);}catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",metaColor(v));
    var menu=document.getElementById("nxThemeMenu");
    if(menu)[].forEach.call(menu.children,function(it){it.classList.toggle("on",it.getAttribute("data-v")===v);});
    try{if(typeof applyAccent==="function")applyAccent(document.body.getAttribute("data-accent")||"gold");}catch(e){}
  }
  function initSwitcher(){
    var host=document.querySelector(".top-actions");if(!host||document.getElementById("nxPaletteBtn"))return;
    var btn=document.createElement("button");btn.className="iconbtn nx-palette";btn.id="nxPaletteBtn";btn.title="Motyw (T)";
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>';
    var wrap=document.createElement("div");wrap.className="nx-themes";
    var menu=document.createElement("div");menu.className="nx-menu";menu.id="nxThemeMenu";
    THEMES.forEach(function(t){
      var it=document.createElement("div");it.className="nx-ti";it.setAttribute("data-v",t.v);
      it.innerHTML='<span class="sw" style="background:'+t.c+'"></span>'+t.n;
      it.onclick=function(){applyTheme(t.v);menu.classList.remove("on");};
      menu.appendChild(it);
    });
    btn.onclick=function(e){e.stopPropagation();menu.classList.toggle("on");};
    document.addEventListener("click",function(){menu.classList.remove("on");});
    wrap.appendChild(btn);wrap.appendChild(menu);host.insertBefore(wrap,host.firstChild);
    document.addEventListener("keydown",function(e){if(e.key==="t"&&!/input|textarea/i.test((e.target.tagName||""))){applyTheme(nextTheme());}});
    var saved="arctic";try{var _s=localStorage.getItem("nexion.theme");saved=(_s===null||_s==="goldlight"||_s==="gold"?"arctic":_s);}catch(e){}
    applyTheme(saved);
  }
  function nextTheme(){var cur=document.documentElement.getAttribute("data-theme")||"";var i=THEMES.map(function(t){return t.v;}).indexOf(cur);return THEMES[(i+1)%THEMES.length].v;}

  function parallax(){
    if(document.body.classList.contains("reduce"))return;
    var sw=document.getElementById("nx-sweep");if(!sw)return;
    var tx=0,ty=0,cx=0,cy=0,raf=0;
    window.addEventListener("pointermove",function(e){tx=(e.clientX/innerWidth-.5)*26;ty=(e.clientY/innerHeight-.5)*26;if(!raf)raf=requestAnimationFrame(loop);},{passive:true});
    function loop(){cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;sw.style.transform="translate3d("+cx+"px,"+cy+"px,0)";raf=(Math.abs(tx-cx)>.2||Math.abs(ty-cy)>.2)?requestAnimationFrame(loop):0;}
  }

  function nxCount(){
    if(document.body.classList.contains("reduce"))return;
    document.querySelectorAll(".kpi .kn, .statline .s .n").forEach(function(el){
      if(el.dataset.nx)return;var orig=el.textContent;var m=orig.match(/-?\d[\d .,]*/);if(!m){el.dataset.nx="1";return;}
      var numText=m[0];var target=parseFloat(numText.replace(/ /g,"").replace(/\./g,"").replace(",","."));
      if(!isFinite(target)||target<=0){el.dataset.nx="1";return;}
      el.dataset.nx="1";var isInt=numText.indexOf(",")<0;var start=performance.now(),dur=680;
      function tick(t){var p=Math.min(1,(t-start)/dur);var e=1-Math.pow(1-p,3);var cur=target*e;
        var disp=isInt?Math.round(cur).toLocaleString("pl-PL"):cur.toFixed(1);
        el.textContent=orig.slice(0,m.index)+disp+orig.slice(m.index+numText.length);
        if(p<1)requestAnimationFrame(tick);else el.textContent=orig;}
      requestAnimationFrame(tick);
    });
  }

  function buildTabs(){
    var navs=[].slice.call(document.querySelectorAll("#side .navbtn")).slice(0,5);if(!navs.length)return;
    var old=document.getElementById("nx-tabs");if(old)old.remove();
    var bar=document.createElement("div");bar.id="nx-tabs";
    navs.forEach(function(nav){
      var b=document.createElement("button");var svg=nav.querySelector("svg");
      var label=(nav.textContent||"").trim().split(/\s+/)[0].slice(0,9);
      b.innerHTML=(svg?svg.outerHTML:"")+"<span>"+label+"</span>";
      b.onclick=function(){nav.click();};b._nav=nav;bar.appendChild(b);
    });
    document.body.appendChild(bar);refreshTabs();
  }
  function refreshTabs(){var bar=document.getElementById("nx-tabs");if(!bar)return;[].forEach.call(bar.children,function(b){b.classList.toggle("on",b._nav&&b._nav.classList.contains("on"));});}

  function wrapGo(){if(typeof window.go!=="function"||window.go.__nx)return;var _g=window.go;window.go=function(){var r=_g.apply(this,arguments);setTimeout(function(){nxCount();refreshTabs();},70);return r;};window.go.__nx=1;}

  function start(){initSwitcher();parallax();wrapGo();buildTabs();setTimeout(nxCount,120);setTimeout(nxCount,600);}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(start,60);});
  else setTimeout(start,60);
})();
</script>

(function(){

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', {scope:'./'}).then(function(reg){
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){ nw.postMessage('SKIP_WAITING'); }
        });
      });
    }).catch(function(){});
    var refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshing) return; refreshing=true; window.location.reload();
    });
  });
})();
</script>
